name: Publish Godot Web to Pages

# Pubblicazione solo su richiesta: «Run workflow» a mano, oppure un commit su main
# con [pubblica] nel messaggio. Un push normale non pubblica nulla.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pubblica]')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7 and export templates
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.stable"
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.stable/"
      - name: Verify gameplay rules
        run: |
          pip install --quiet fonttools
          python3 tools/controlla_glifi.py
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --editor --path . --quit
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/verifica.gd
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/schieramento.gd
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/attivazione_round.gd
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/salvataggio.gd
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/simula.gd -- 8 1
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/missione2.gd
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/simula.gd -- 6 1 2
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/missione3.gd
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/simula.gd -- 6 1 3
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/missione4.gd
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/simula.gd -- 6 1 4
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/missione5.gd
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/simula.gd -- 6 1 5
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/missione6.gd
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/simula.gd -- 4 1 6
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/missione7.gd
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/simula.gd -- 4 1 7
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/missione8.gd
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/simula.gd -- 4 1 8
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/missione9.gd
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/simula.gd -- 3 1 9
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/missione10.gd
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/simula.gd -- 3 1 10
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/piani.gd
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/missione12.gd
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/missione16.gd
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/simula.gd -- 3 1 12
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/missione11.gd
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/simula.gd -- 4 1 11
      - name: Export Web build
        run: |
          mkdir -p build/web
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --export-release Web build/web/index.html
          touch build/web/.nojekyll
          test -s build/web/index.html
          test -s build/web/index.pck
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
